name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Maintain a single updating review comment so every run is visible,
          # even when there are no inline findings.
          use_sticky_comment: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}
            and post a single summary comment with your findings.

            Context — this repo is the `daily-lesson` Claude Code plugin, built on these invariants:
            - Page chrome (CSS/JS/layout) is frozen in `assets/*.html`; each run authors only lesson *content*.
            - `scripts/render_lesson.py` slots content into the shells via literal {{TOKEN}} replacement —
              meta scalars are HTML-escaped, while BODY and DEK are injected raw by design.
            - `concept_key` is the dedup key; exit codes 0 ok / 2 bad input / 3 duplicate / 4 missing assets
              are the command<->renderer contract.

            Your summary comment must include:
            - One short paragraph: what this PR changes.
            - Blocking issues — real bugs, correctness problems, or broken invariants (cite file:line).
            - Suggestions, clearly separated from blocking issues.
            Keep it concise. If nothing needs changing, say so in one line. Always post the comment.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

